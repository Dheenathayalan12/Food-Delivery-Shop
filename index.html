<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasty Bites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1 id="brand"></h1>
  <input id="search" type="search" placeholder="Search menu...">
  <button id="cartBtn" class="cart-btn">🛒 <span id="cartCount">0</span></button>
</header>

<nav id="categories" class="categories"></nav>
<main id="menuGrid" class="menu-grid"></main>

<!-- Cart drawer -->
<aside id="cartDrawer" class="drawer">
  <div class="drawer-head">
    <h2>Your Cart</h2>
    <button id="closeCart">✕</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div id="summary" class="summary"></div>
  <button id="checkoutBtn" class="btn primary full" style="margin-top:12px">Checkout</button>
</aside>
<div id="overlay" class="overlay"></div>

<!-- Checkout modal -->
<div id="checkoutModal" class="modal hidden">
  <div class="modal-box">
    <h2>Checkout</h2>
    <form id="checkoutForm">
      <input name="name" placeholder="Full name" required>
      <input name="phone" placeholder="Phone number" required>
      <textarea name="address" placeholder="Delivery address" rows="2" required></textarea>

      <label>Payment method
        <select name="method" id="payMethod">
          <option value="cod">Cash on delivery</option>
          <option value="card">Credit / Debit card</option>
        </select>
      </label>

      <div id="cardFields" class="hidden">
        <input name="cardNumber" placeholder="Card number" inputmode="numeric" maxlength="19">
        <div class="row">
          <input name="expiry" placeholder="MM/YY" maxlength="5">
          <input name="cvv" placeholder="CVV" inputmode="numeric" maxlength="4">
        </div>
      </div>

      <div id="payTotal" class="pay-total"></div>
      <p id="payError" class="error"></p>

      <div class="row">
        <button type="button" id="cancelCheckout" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Pay &amp; Place Order</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<footer class="site-footer">
  <p>&copy; <span id="year"></span> <span id="footerBrand"></span>. All rights reserved.</p>
  <p>
    <a href="admin.html" class="admin-link">Admin Login</a>
  </p>
</footer>

<script src="shared.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("footerBrand").textContent = CONFIG.restaurantName;
</script>
</body>
</html>
